<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f1b14">
<meta name="description" content="E-Bike Life — hold your balance, clear the boost pads, and outrun the cops in this free browser 3D electric bike stunt game.">
<title>E-Bike Life</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1b14'/%3E%3Ctext x='32' y='45' font-size='34' text-anchor='middle' fill='%23c0f56a' font-family='Arial,sans-serif' font-weight='bold'%3EW%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="loading-screen" id="loading-screen" role="status" aria-live="polite">
  <div class="loading-inner">
    <span class="loading-mark">W<span>/</span>X</span>
    <span class="loading-label" id="loading-label">LOADING THE STREETS</span>
    <div class="loading-track"><span id="loading-fill"></span></div>
    <span class="loading-percent" id="loading-percent">INITIALIZING 3D ENGINE</span>
    <span class="loading-error hidden" id="loading-error" role="alert"></span>
    <button class="loading-retry hidden" id="loading-retry" type="button">RELOAD GAME ↻</button>
  </div>
</div>
<canvas id="g"></canvas><div id="sl"></div>
<canvas id="mm" width="300" height="300"></canvas>
<div id="top" class="p"><div id="cash">$0</div><div id="combo"></div><div id="wanted"></div></div><div id="pl"></div>
<div id="tr" class="p"><div id="net">Connecting…</div><button id="bg">🏍 Garage [G]</button><button id="bm">🔊</button></div>
<div id="pop"></div><canvas id="wm" width="240" height="130"></canvas>
<div id="br" class="p"><div id="sp"></div><div class="bar"><i id="bb" style="width:100%"></i></div><small>BOOST [E] · tap speed for units</small></div>
<div id="help" class="p">W/↑ throttle · S/↓ brake · A/D steer · Space/Shift pop wheelie (W/S to balance) · E/F boost · G garage · speed or wheelie near cops = chase!</div>
<div id="tc">
<button data-k="KeyA" style="left:12px;bottom:90px">◀</button><button data-k="KeyD" style="left:86px;bottom:90px">▶</button>
<button data-k="Space" style="left:12px;bottom:16px;width:138px">WHEELIE</button>
<button data-k="KeyW" style="right:12px;bottom:90px">▲</button><button data-k="KeyS" style="right:86px;bottom:90px">■</button>
<button data-k="KeyE" style="right:12px;bottom:16px;width:138px;background:#7c3aed">⚡ BOOST</button></div>
<div id="gar"></div>
<script src="https://unpkg.com/mqtt@5.3.4/dist/mqtt.min.js"></script>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script>
  (() => {
    const screen = document.getElementById("loading-screen");
    const fill = document.getElementById("loading-fill");
    const percent = document.getElementById("loading-percent");
    const label = document.getElementById("loading-label");
    const error = document.getElementById("loading-error");
    const retry = document.getElementById("loading-retry");
    const gameModule = document.getElementById("game-module");
    gameModule.addEventListener("error", () => fail("The game engine could not be loaded. Check your internet connection and reload."));
    let finished = false;

    const finish = () => {
      if (finished) return;
      finished = true;
      fill.classList.add("complete");
      fill.style.width = "100%";
      percent.textContent = "READY";
      screen.classList.add("done");
      window.setTimeout(() => screen.classList.add("hidden"), 500);
    };
    const fail = (message) => {
      if (finished) return;
      finished = true;
      screen.classList.add("failed");
      label.textContent = "THE STREETS DIDN'T LOAD";
      percent.textContent = "STARTUP ERROR";
      error.textContent = message || "Check your connection and try again.";
      error.classList.remove("hidden");
      retry.classList.remove("hidden");
    };
    const safeFinish = () => { if (!finished) finish(); };
    retry.addEventListener("click", () => window.location.reload());
    window.WheelieXLoading = { finish: safeFinish, fail };
    window.addEventListener("load", safeFinish, { once: true });
    window.setTimeout(() => { if (!finished) safeFinish(); }, 8000);
  })();
</script>
<script id="game-module" type="module" src="./game.js"></script>
<noscript><div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#bfdef2;color:#0f1b14;font-family:system-ui,sans-serif;font-size:14px;line-height:1.5;padding:20px;text-align:center">E-Bike Life needs WebGL support and an internet connection to load the 3D engine. Please try again in a modern browser.</div></noscript>
</body></html>
